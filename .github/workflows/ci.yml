name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - name: Install gregorithm
        shell: bash
        run: |
          if [ -z "${{ vars.GREGORITHM_REQUIREMENT }}" ]; then
            echo "Set the repository variable GREGORITHM_REQUIREMENT (see CONTRIBUTING.md)." >&2; exit 1
          fi
          python -m pip install "${{ vars.GREGORITHM_REQUIREMENT }}"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python tools/run_tests.py
